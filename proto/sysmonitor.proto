// NOTE: SysMonitor-Agent와 SysMonitor-Server는 별도 레포이므로 이 파일은
// SysMonitor-Server/proto/sysmonitor.proto와 수동으로 동기화해야 합니다.
// 메시지 구조를 바꿀 때는 반드시 ProtocolVersion.PROTOCOL_VERSION_CURRENT 값을 올릴 것 —
// 한쪽 레포만 바뀐 상태로 연결하면 Hello에서 FAILED_PRECONDITION으로 거부된다.
syntax = "proto3";

package sysmonitor;

// Hello로 교환하는 프로토콜 버전. 버전 값의 유일한 정의 지점이 이 파일이므로,
// 두 레포의 proto가 동기화되어 있으면 버전도 같고, 어긋나 있으면 버전도 다르다.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;   // Hello에 버전을 싣지 않던 이전 Agent
  // 1 (2026-09-23): AgentData를 oneof 스냅샷 구조로 변경
  // 2 (2026-09-23): 모든 RPC에 metadata "instance_id" 필수 (같은 agent_id를 쓰는 다른 PC 구분)
  // 3 (2026-10-04): 수집하지 못한 값을 0과 구분 — TargetProcess.memory_mb / gdi_object_count, TargetInfo.exe_path를 optional로
  // 4 (2026-10-05): PDH에서 오는 TargetProcess 지표 전부와 TargetInfo.elapsed_sec를 optional로 (새 프로세스의 첫 틱 등)
  // 5 (2026-10-11): SysSnapshot의 지표 전부와 ProcInfo의 PDH 지표를 optional로 (읽지 못한 값을 0과 구분)
  PROTOCOL_VERSION_CURRENT = 6;       // 2026-10-15: GetResumePoint RPC, 갭 메시지의 AgentData.collected_instance_id (Phase 4 갭 전송)
}

// ---------------------------------------------------------------------------
// 스냅샷 (Agent의 models/SnapShotData.h와 1:1 대응)
// 모든 string 필드는 UTF-8이어야 한다 — 수집기는 W API + CP_UTF8 변환으로 채울 것 (기획노트 Phase 3-0).
// ---------------------------------------------------------------------------

// SnapshotSysData (cpu / mem / disk / net)
// optional 필드: 값이 없으면(has_xxx() == false) Agent가 그 값을 읽지 못한 것이다 — 그 카운터가 없는 Windows이거나
// 그 틱의 수집이 실패했을 때. 0은 실제로 0일 때만 보낸다. 받는 쪽은 없는 값을 0으로 읽지 말고 "N/A"로 다룰 것.
message SysSnapshot {
  int64 timestamp_us = 1;          // epoch 마이크로초 (Agent DataStore::toTimestamp()와 같은 단위)

  optional double cpu_total = 2;
  optional double cpu_freq_ghz = 3;
  optional double cpu_user = 4;
  optional double cpu_kernel = 5;
  optional double cpu_queue_length = 6;

  optional double mem_total_mb = 7;
  optional double mem_usage_percent = 8;   // mem_total_mb와 mem_avail_mb로 계산 — 둘 중 하나가 없으면 없다
  optional double mem_used_mb = 9;         // 위와 같음
  optional double mem_avail_mb = 10;
  optional double commit_mem_percent = 11;
  optional double committed_mem_gb = 12;
  optional double commit_limit_gb = 13;

  optional double disk_read_kbs = 14;
  optional double disk_write_kbs = 15;

  optional double net_sent_kbps = 16;
  optional double net_recv_kbps = 17;
}

// SnapshotProc
// optional 필드(PDH에서 오는 지표): 값이 없으면 Agent가 그 값을 읽지 못한 것이다 — 그 카운터의 배열을 읽지 못한 틱,
// 프로세스가 처음 보인 틱의 비율 값(cpu_usage, disk_*_mbs). 0은 실제로 0일 때만 보낸다.
// 값이 하나도 없어도 pid와 name은 온다(프로세스 목록에서 오는 값) — 목록 자체가 비는 것은 아니다.
// 같은 이름의 자식을 부모에 합친 값은 있는 값만 더한 것이다.
message ProcInfo {
  uint32 pid = 1;
  string name = 2;
  optional double cpu_usage = 3;
  optional double memory_mb = 4;
  optional double private_memory_mb = 5;
  optional double disk_read_mbs = 6;
  optional double disk_write_mbs = 7;
  double net_sent_mbps = 8;
  double net_recv_mbps = 9;
}

// SnapshotProcData — 전체 프로세스 목록. TopN 개수/정렬 기준은 UI가 정하므로 Agent는 자르지 않는다 (기획노트 §2).
message ProcSnapshot {
  int64 timestamp_us = 1;
  repeated ProcInfo procs = 2;
}

// TargetNetConnection
message NetConnection {
  string protocol = 1;      // TCP / UDP
  string local_addr = 2;    // IP:Port
  string remote_addr = 3;   // IP:Port
  string state = 4;         // ESTABLISHED, LISTEN 등
}

// 타겟의 메인 프로세스와 자식 프로세스(SnapshotChildProcess)가 공유하는 지표
// optional 필드: 값이 없으면(has_xxx() == false) "수집하지 못함"이다. 0은 실제로 0일 때만 보낸다.
// 받는 쪽은 없는 값을 0으로 읽지 말고 "N/A"로 다룰 것 (2026-10-01 Phase 3 리뷰 High #5).
// 값이 없는 경우:
//   - Agent에 그 프로세스를 열 권한이 없을 때 (memory_mb, gdi_object_count — 관리자 권한 없이 서비스 계정의 프로세스를 볼 때 등)
//   - 비율 값(cpu_usage, disk_*_mbs, page_fault_rate)은 두 시점의 차이로 계산하므로, 프로세스가 처음 보인 틱과
//     Agent가 수집을 쉬었다가 재개한 틱에는 없다
//   - 그 틱에 PDH가 그 프로세스의 값을 주지 않았을 때 (PDH에서 오는 지표 전부)
// 합계를 낼 때는 값이 있는 것만 더한다.
message TargetProcess {
  uint32 pid = 1;
  string name = 2;
  optional double cpu_usage = 3;    // 시스템 전체 대비 % (코어 수로 나눈 값)
  optional double memory_mb = 4;    // Working Set - Private
  optional double private_memory_mb = 5;
  optional double virtual_memory_mb = 6;
  optional double disk_read_mbs = 7;
  optional double disk_write_mbs = 8;
  double net_sent_mbps = 9;
  double net_recv_mbps = 10;
  optional uint32 thread_count = 11;
  optional uint32 handle_count = 12;   // PDH "Handle Count" — 프로세스를 열 권한이 없어도 읽힌다
  optional uint32 gdi_object_count = 13;
  optional double page_fault_rate = 14;
  repeated NetConnection connections = 15;
}

// SnapshotTarget의 last* 필드 — status가 RUNNING이 아닐 때만 채워진다
message LastSessionSummary {
  string date = 1;
  double avg_cpu_usage = 2;
  double peak_cpu_usage = 3;
  double avg_memory_mb = 4;
  double peak_memory_mb = 5;
  double avg_net_mbps = 6;
  double peak_net_mbps = 7;
  uint32 peak_thread_count = 8;
  uint32 peak_handle_count = 9;
  double total_runtime_sec = 10;
}

message TargetInfo {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    RUNNING = 1;
    NOT_RUNNING = 2;
    NEVER_SEEN = 3;
  }

  string name = 1;
  optional string exe_path = 2;           // 없음 = 수집하지 못함 (TargetProcess의 optional과 같은 규칙) 또는 NEVER_SEEN
  Status status = 3;
  LastSessionSummary last_session = 4;    // status != RUNNING일 때만
  TargetProcess main = 5;                 // status == RUNNING일 때만
  optional double elapsed_sec = 6;        // 메인 프로세스의 실행 시간 (TargetProcess의 optional과 같은 규칙)
  repeated TargetProcess children = 7;
  // total* 합계(SnapshotTarget::calcTotals())는 main + children으로 서버가 계산할 수 있으므로 보내지 않는다.
}

// SnapshotTargetData
message TargetSnapshot {
  int64 timestamp_us = 1;
  repeated TargetInfo targets = 2;
}

// ---------------------------------------------------------------------------
// 전송 단위
// ---------------------------------------------------------------------------

// 메시지 1개 = 스냅샷 1건. sys/proc/target 구분은 oneof, 실시간/갭 구분은 어느 RPC로 왔는지로 한다.
message AgentData {
  string agent_id = 1;      // 서버가 인증된 metadata의 agent_id와 대조한다

  // Phase 1/2의 timestamp(초) / type(DataType) / payload(string) — 번호·이름 재사용 금지
  reserved 2, 3, 4;
  reserved "timestamp", "type", "payload";

  oneof body {
    SysSnapshot sys = 10;
    ProcSnapshot proc = 11;
    TargetSnapshot target = 12;
  }

  // 이 스냅샷을 수집한 장비의 instance_id. 갭 메시지(StreamBatch)에는 필수 — Agent의 로컬 버퍼는 설치 폴더와 함께
  // 다른 PC로 복사될 수 있어, 지금 연결한 장비가 수집한 데이터라는 보장이 없다. 서버는 이 값과 자기의 연결 이력으로
  // 출처를 판정한다. 실시간 메시지에서는 비워 둔다 — 연결의 metadata instance_id가 곧 수집 장비다.
  string collected_instance_id = 5;
}

message ResumePointRequest {}

message ResumePoint {
  // 서버가 이 agent_id의 실시간 채널에서 마지막으로 읽은 스냅샷의 timestamp_us. 없음 = 서버가 아는 기록이 없다
  // (서버 재시작 등) — Agent는 버퍼를 전부 보낸다. 같은 틱의 일부 스냅샷만 받았을 수 있으므로 Agent는 이 값과
  // 같은 timestamp의 스냅샷도 다시 보내고, 받는 쪽은 (스냅샷 종류, timestamp)가 같은 것을 중복으로 본다.
  optional int64 last_realtime_timestamp_us = 1;
}

// 스트림을 열기 전 인증 + 프로토콜 버전 확인용. 인증 정보는 본문이 아니라 call metadata로 전달한다.
// 모든 RPC(Hello / StreamRealtime / StreamBatch)의 필수 metadata:
//   agent_id    — agents.ini에 등록된 ID
//   api_key     — 그 ID의 키
//   instance_id — 설치(PC) 단위 고유값 (Agent: Windows MachineGuid). 같은 agent_id로 다른 PC가
//                 동시에 접속하면 서버가 ALREADY_EXISTS로 거부한다. 같은 instance의 재접속은 허용.
message HelloRequest {
  uint32 protocol_version = 1;   // ProtocolVersion 값
}

message Ack {
  bool success = 1;
  string message = 2;
}

service AgentService {
  // 연결 직후 1회: metadata 인증 + 프로토콜 버전 확인 후 즉시 응답 (성공 시 Ack.message = "Hello <agent_id>").
  // 스트림 인증을 대체하지 않는다 — 서버는 StreamRealtime/StreamBatch에서도 매번 인증한다.
  rpc Hello(HelloRequest) returns (Ack);
  // 실시간 채널에서 서버가 마지막으로 읽은 timestamp. Agent는 연결할 때(갭 전송 범위 결정)와 연결 중 주기적으로
  // (메모리에 보관한 "아직 확인되지 않은" 스냅샷 정리 + 응답 없는 연결 감지) 호출한다. 인증·세션 규칙은 Hello와 같다.
  rpc GetResumePoint(ResumePointRequest) returns (ResumePoint);
  // 1초마다 sys / proc(전체 목록) / target 스냅샷 (스냅샷 1건 = 메시지 1개)
  rpc StreamRealtime(stream AgentData) returns (Ack);
  // 재연결 후 갭 데이터 전송 전용 (스냅샷 1건 = 메시지 1개, collected_instance_id 필수). 주기적 배치 전송은 없다 (기획노트 §2).
  // Agent는 묶음마다 스트림을 열고 닫는다 — 서버가 OK로 끝낸 묶음만 받은 것으로 보고 로컬 버퍼에서 지운다.
  rpc StreamBatch(stream AgentData) returns (Ack);
}
